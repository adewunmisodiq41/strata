        imagesizes="100vw" media="(min-width: 768px)" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121211'/%3E%3Cpath d='M7 10h18M7 16h18M7 22h18' stroke='%23F3F1EC' stroke-width='2.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <script type="application/ld+json" id="ld-org">
  {"@context":"https://schema.org","@type":"ClothingStore","name":"STRATA","url":"https://strata.studio","email":"hello@strata.studio","address":{"@type":"PostalAddress","streetAddress":"Studio 04, 118 Kingsland Road","addressLocality":"London","postalCode":"E2 8DP","addressCountry":"GB"},"openingHours":"Mo-Fr 10:00-18:00"}
  </script>
  <script type="application/ld+json" id="ld-page"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Announcement -->
  <a class="announce" id="announce" href="#/shop?new=1">
    <span class="announce__track"><span data-announce></span></span>
  </a>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header__inner">
      <button class="icon-btn header__burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mnav">
        <span class="burger"><i></i><i></i></span>
      </button>
      <nav class="header__nav" aria-label="Primary">
        <a href="#/shop?new=1" data-nav="new">New Arrivals</a>
        <a href="#/shop?dept=women" data-nav="women">Women</a>
        <a href="#/shop?dept=men" data-nav="men">Men</a>
        <a href="#/shop?cat=accessories" data-nav="accessories">Accessories</a>
        <a href="#/collections" data-nav="collections">Collections</a>
      </nav>
      <a class="logo" href="#/" aria-label="STRATA home"><span data-brand>STRATA</span></a>
      <div class="header__actions">
        <button class="icon-btn" data-open-search aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
        <a class="icon-btn header__account" href="#/account" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.4-6 8-6s6.8 2 8 6"/></svg>
        </a>
        <button class="bag-btn" data-open-cart aria-label="Shopping bag">
          <span class="bag-btn__label">Bag</span>
          <svg class="bag-btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="bag-btn__count" data-cart-count aria-live="polite">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile menu -->
  <div class="mnav" id="mnav" aria-hidden="true">
    <div class="mnav__inner">
      <nav class="mnav__links" aria-label="Mobile">
        <a href="#/shop?new=1"><span>New Arrivals</span><em>01</em></a>
        <a href="#/shop?dept=women"><span>Women</span><em>02</em></a>
        <a href="#/shop?dept=men"><span>Men</span><em>03</em></a>
        <a href="#/shop?cat=accessories"><span>Accessories</span><em>04</em></a>
        <a href="#/collections"><span>Collections</span><em>05</em></a>
        <a href="#/about"><span>About</span><em>06</em></a>
      </nav>
      <div class="mnav__foot">
        <button data-open-search>Search</button>
        <a href="#/account">Account</a>
        <a href="#/wishlist">Wishlist</a>
        <a href="#/contact">Contact</a>
        <a href="#/faq">Help</a>
      </div>
    </div>
  </div>

  <main id="main" class="main" tabindex="-1"></main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Cart drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title" aria-hidden="true">
    <div class="drawer__head">
      <h2 id="cart-title" class="label">Shopping Bag <span data-cart-count-text></span></h2>
      <button class="icon-btn" data-close-cart aria-label="Close bag"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    </div>
    <div class="drawer__ship" id="cart-ship"></div>
    <div class="drawer__body" id="cart-body"></div>
    <div class="drawer__foot" id="cart-foot"></div>
  </aside>

  <!-- Search overlay -->
  <div class="search" id="search" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true">
    <div class="search__bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <label for="search-input" class="sr-only">Search products</label>
      <input id="search-input" type="search" placeholder="Search products, collections, categories" autocomplete="off" />
      <button class="icon-btn" data-close-search aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    </div>
    <div class="search__body" id="search-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">This store needs JavaScript enabled to browse products.</p></noscript>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/cms.js"></script>
  <script src="assets/js/boot.js"></script>
</body>
</html>
